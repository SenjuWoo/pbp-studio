# CI for PBP Studio: syntax + offline self-test on a clean Python environment.
# Tests are offline: region map, magic table, XML writer, settings, and the whole piece pipeline run
# against a fake SwarmUI on a synthetic template (no GPU, no game install, no third-party art).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile check
        run: python -m compileall -q app

      - name: Tests (pipeline, selftest, server guard)
        run: |
          python -m pip install pytest
          python -m pytest
